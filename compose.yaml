name: stepmeter
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stepmeter
      POSTGRES_PASSWORD: stepmeter
      POSTGRES_DB: stepmeter
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stepmeter -d stepmeter"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
  # M2 services are opt-in while API/agent implementations are pending.
  api:
    profiles: ["m2"]
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    command: ["python", "-m", "infra.scripts.start_api"]
    environment:
      DATABASE_URL: postgresql+psycopg://stepmeter:stepmeter@db:5432/stepmeter
      REDIS_URL: redis://redis:6379/0
      STEPMETER_ENV: development
      STEPMETER_API_COMMAND: ${STEPMETER_API_COMMAND:-uvicorn apps.api.main:app --host 0.0.0.0 --port 8000}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3).close()"]
      interval: 3s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - screenshots:/app/data/screenshots
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  worker:
    profiles: ["m2"]
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    command: ["python", "-m", "infra.scripts.start_worker"]
    init: true
    shm_size: 1gb
    environment:
      DATABASE_URL: postgresql+psycopg://stepmeter:stepmeter@db:5432/stepmeter
      REDIS_URL: redis://redis:6379/0
      STEPMETER_ENV: development
      STEPMETER_LLM: fake
      STEPMETER_FAKE_REPLIES: tests/fixtures/e2e/signup/fake_replies.json
      STEPMETER_E2E_SITE_URL: http://m2-fixtures:8765/
    volumes:
      - screenshots:/app/data/screenshots
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      m2-fixtures:
        condition: service_healthy
  m2-fixtures:
    profiles: ["m2"]
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    command: ["python", "-m", "http.server", "8765", "--bind", "0.0.0.0", "--directory", "tests/fixtures/e2e"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/signup/index.html', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20
  test-db:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stepmeter
      POSTGRES_PASSWORD: stepmeter
      POSTGRES_DB: stepmeter_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stepmeter -d stepmeter_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  test-redis:
    profiles: ["test"]
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    init: true
    shm_size: 1gb
    environment:
      TEST_REDIS_URL: redis://test-redis:6379/15
      TEST_DATABASE_URL: postgresql+psycopg://stepmeter:stepmeter@test-db:5432/stepmeter_test
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
  migrate:
    profiles: ["tools", "m2"]
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+psycopg://stepmeter:stepmeter@db:5432/stepmeter
    command: ["python", "-m", "alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  screenshots:
