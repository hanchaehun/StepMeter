name: stepmeter
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stepmeter
      POSTGRES_PASSWORD: stepmeter
      POSTGRES_DB: stepmeter
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stepmeter -d stepmeter"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
  test-db:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stepmeter
      POSTGRES_PASSWORD: stepmeter
      POSTGRES_DB: stepmeter_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stepmeter -d stepmeter_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    init: true
    shm_size: 1gb
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://stepmeter:stepmeter@test-db:5432/stepmeter_test
    depends_on:
      test-db:
        condition: service_healthy
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+psycopg://stepmeter:stepmeter@db:5432/stepmeter
    command: ["python", "-m", "alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
