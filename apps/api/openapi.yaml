        in_first_view:
          type: boolean
        first_view_scroll_px:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
        nearby_targets:
          items:
            $ref: '#/components/schemas/NearbyTarget'
          type: array
      required:
      - el_id
      - tag
      - role
      - name
      - landmark
      - label_text
      - inline_in_text
      - context
      - viewport
      - scroll
      - bbox
      - style
      - bg_chain
      - occluded
      - occluder
      - in_first_view
      - first_view_scroll_px
      - nearby_targets
      type: object
