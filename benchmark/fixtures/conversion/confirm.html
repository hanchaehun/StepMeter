<!doctype html><html lang="ko"><meta charset="utf-8"><title>구독 확인</title><style>body{font:18px system-ui;color:#172033;background:white;margin:12px}button{font:inherit;min-height:48px;padding:12px;background:#1746a2;color:white;border:0}</style><main><button id="confirm" disabled>구독 내용 확인하기</button><p id="confirmation" role="status"></p></main><script>

</script></html>
